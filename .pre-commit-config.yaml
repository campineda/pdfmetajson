# Run `pre-commit install` once after `pip install -e ".[dev]"`; the hooks then run on every
# commit. Tool settings are read from pyproject.toml. Update revisions with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies: ["Flake8-pyproject"]
