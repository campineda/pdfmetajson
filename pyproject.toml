[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PdfMetaJson"
version = "0.3.0"
description = "Python command utility to scan PDF files from a path and extract metadata and some content from them into a Json file."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Camilo A. Pineda R.", email = "69707898+campineda@users.noreply.github.com" }
]
dependencies = [
    "Unidecode~=1.4.0",
    "pypdf>=6.0.0",
    "colorlog>=6.9.0",
    "cryptography>=45.0.6"
]

[project.urls]
Homepage = "https://github.com/campineda/pdfmetajson"
Repository = "https://github.com/campineda/pdfmetajson"

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    # "pytest",
    # "mypy",
]

[tool.black]
line-length = 88
# include = ...
# exclude = ...

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",
    "W503",
]
# exclude = [ ... ]
# max-complexity = 10