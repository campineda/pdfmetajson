[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PdfMetaJson"
version = "0.5.0"
description = "Python command utility to scan PDF files from a path and extract metadata and some content from them into a Json file."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Camilo A. Pineda R.", email = "69707898+campineda@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "Unidecode~=1.4.0",
    # The crypto extra pulls in cryptography, needed to read AES-encrypted PDFs
    "pypdf[crypto]>=6.0.0",
    "colorlog>=6.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1",
    "isort>=6.0",
    "flake8>=7.0",
    # Lets flake8 read its settings from [tool.flake8] below
    "Flake8-pyproject>=1.2",
    "pre-commit>=4.0",
]

[project.scripts]
pdfmetajson = "pdfmetajson.__main__:main"

[project.urls]
Homepage = "https://github.com/campineda/pdfmetajson"
Repository = "https://github.com/campineda/pdfmetajson"
Changelog = "https://github.com/campineda/pdfmetajson/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["pdfmetajson"]

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",
    "W503",
]
exclude = [".git", ".venv", "build", "dist", "__pycache__"]
